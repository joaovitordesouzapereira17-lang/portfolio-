<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Neshop Friday v4</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Yellowtail;src:url(blender/fonts/Yellowtail-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:Montserrat,sans-serif;padding:20px}
.banner{position:relative;overflow:hidden;margin-bottom:20px;background:#00030d}
.bg{position:absolute;inset:0;background:url(blender/bg/nuvens.png) center bottom/cover;filter:brightness(1.9) saturate(1) hue-rotate(-30deg)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,4,14,.82) 0%,rgba(0,4,14,.55) 38%,rgba(0,4,14,0) 62%)}
.wave{position:absolute;background:url(blender/bg/onda.png) center/cover;mix-blend-mode:screen;opacity:.75;
  -webkit-mask:radial-gradient(closest-side,#000 35%,transparent 100%);filter:saturate(1.1)}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay}
.title{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 16px rgba(0,8,24,.55))}
.script{position:absolute;font-family:Yellowtail,cursive;color:#22d3ff;white-space:nowrap;transform:rotate(-9deg);transform-origin:left center;
  text-shadow:0 3px 0 #04223a,0 8px 18px rgba(0,0,0,.55)}
.prod{position:absolute;filter:drop-shadow(-10px 16px 22px rgba(0,0,0,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.title,.script,.sub,.cta{z-index:5}
.floor{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent)}
.sub{position:absolute;font-weight:600;color:#d9f3ff;letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.sub b{color:#22d3ff;font-weight:800}
.cta{position:absolute;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.06em;color:#00121f;
  background:linear-gradient(180deg,#8ff0ff,#22d3ff);border-radius:999px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.18)}
</style></head><body>
<div id="root"></div>
<script>
const CFG={
 1920:{H:480,title:'blender/title-1920.png',
  script:{t:'ofertas',x:600,y:166,fs:104},
  sub:{x:100,y:382,fs:28,w:null,html:'Preços especiais em <b>peças e componentes</b>'},
  cta:{x:768,y:370,w:224,h:56,fs:21},
  wave:{x:1000,y:-200,w:1000,h:880},
  prods:[['controle',540,1700,40,9,1],['alicate',640,1430,-20,-7,2],['testador',250,1110,290,-4,3]]},
 1500:{H:250,title:'blender/title-1500.png',
  script:{t:'ofertas',x:330,y:84,fs:58},
  sub:{x:660,y:58,fs:24,html:'Preços especiais em<br><b>peças e componentes</b>'},
  cta:{x:660,y:148,w:184,h:44,fs:17},
  wave:{x:960,y:-200,w:700,h:620},
  prods:[['controle',300,1360,10,9,1],['alicate',350,1205,-14,-7,2],['testador',132,1035,132,-4,3]]},
 600:{H:338,title:'blender/title-600.png',
  script:{t:'ofertas',x:212,y:96,fs:50},
  sub:{x:34,y:222,fs:17,html:'Preços especiais em<br><b>peças e componentes</b>'},
  cta:{x:34,y:278,w:156,h:38,fs:14},
  wave:{x:300,y:-60,w:460,h:480},
  prods:[['controle',270,522,128,10,1],['alicate',310,436,146,-8,2]]},
};
const AR={testador:564/350,alicate:323/886,controle:212/759};
const root=document.getElementById('root');
for(const [W,c] of Object.entries(CFG)){
 const b=document.createElement('div');b.className='banner';b.id='b'+W;b.style.cssText=`width:${W}px;height:${c.H}px`;
 let h=`<div class="bg"></div><div class="shade"></div>
  <div class="wave" style="left:${c.wave.x}px;top:${c.wave.y}px;width:${c.wave.w}px;height:${c.wave.h}px"></div>`;
 for(const [n,ph,x,top,rot,z] of c.prods)
  h+=`<img class="prod" data-name="${n}" src="blender/products/${n}.png" style="left:${x}px;top:${top}px;height:${ph}px;transform:rotate(${rot}deg);z-index:${z}">`;
 h+=`<img class="title" src="${c.title}">`;
 h+=`<div class="script" style="left:${c.script.x}px;top:${c.script.y}px;font-size:${c.script.fs}px">${c.script.t}</div>`;
 h+=`<div class="sub" style="left:${c.sub.x}px;top:${c.sub.y}px;font-size:${c.sub.fs}px;line-height:1.3">${c.sub.html}</div>`;
 if(c.cta)h+=`<div class="cta" style="left:${c.cta.x}px;top:${c.cta.y}px;width:${c.cta.w}px;height:${c.cta.h}px;font-size:${c.cta.fs}px">Aproveite</div>`;
 b.innerHTML=h;root.appendChild(b);}
</script></body></html>
