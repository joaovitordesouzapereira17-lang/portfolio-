<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Neshop Friday 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#222;font-family:Montserrat,sans-serif;padding:20px}
.banner{position:relative;overflow:hidden;background-size:100% 100%;margin-bottom:20px}
.circuit{position:absolute;inset:0;mix-blend-mode:screen}
.bokeh{position:absolute;border-radius:50%;background:#22d3ff;mix-blend-mode:screen}
.sub{position:absolute;font-weight:600;color:#cfefff;letter-spacing:.02em;text-shadow:0 2px 10px #000}
.sub b{color:#22d3ff;font-weight:800}
.cta{position:absolute;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.06em;color:#00121f;
 background:linear-gradient(180deg,#8ff0ff,#22d3ff);border-radius:999px;display:flex;align-items:center;justify-content:center;
 box-shadow:0 0 18px rgba(34,211,255,.75),inset 0 -3px 0 rgba(0,0,0,.18)}
</style></head><body>
<div class="banner" id="b1920" style="width:1920px;height:480px;background-image:url(blender/render-1920.png)">
 <svg class="circuit" data-seed="7" data-w="1920" data-h="480"></svg>
 <div class="sub" style="left:122px;top:382px;font-size:28px">Preços especiais em <b>peças e componentes</b></div>
 <div class="cta" style="left:812px;top:370px;width:230px;height:58px;font-size:22px">Aproveite</div>
</div>
<div class="banner" id="b1500" style="width:1500px;height:250px;background-image:url(blender/render-1500.png)">
 <svg class="circuit" data-seed="3" data-w="1500" data-h="250"></svg>
 <div class="sub" style="left:745px;top:62px;font-size:25px;line-height:1.35">Preços especiais em<br><b>peças e componentes</b></div>
 <div class="cta" style="left:747px;top:152px;width:200px;height:48px;font-size:19px">Aproveite</div>
</div>
<div class="banner" id="b600" style="width:600px;height:338px;background-image:url(blender/render-600.png)">
 <svg class="circuit" data-seed="11" data-w="600" data-h="338"></svg>
 <div class="sub" style="left:0;width:600px;text-align:center;top:270px;font-size:19px">Preços especiais em <b>peças e componentes</b></div>
</div>
<script>
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
document.querySelectorAll('svg.circuit').forEach(svg=>{
 const W=+svg.dataset.w,H=+svg.dataset.h,r=rng(+svg.dataset.seed*9973);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 let g=`<defs><linearGradient id="f${W}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".22" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient><mask id="m${W}"><rect width="${W}" height="${H}" fill="url(#f${W})"/></mask></defs><g mask="url(#m${W})" stroke="#22d3ff" fill="none" stroke-width="1.4" opacity=".3">`;
 for(let i=0;i<Math.round(W/22);i++){const left=r()<.5;let x=left?0:W,y=r()*H,d=`M${x} ${y}`;const dir=left?1:-1,n=2+Math.floor(r()*3);
  for(let k=0;k<n;k++){const len=20+r()*W*.08;if(k%2==0)x+=dir*len;else{const dy=(r()<.5?-1:1)*len*.6;x+=dir*Math.abs(dy);y+=dy}d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}
  g+=`<path d="${d}"/><circle cx="${x}" cy="${y}" r="3.2" fill="#00040d"/>`}
 svg.innerHTML=g+'</g>';});
document.querySelectorAll('.banner').forEach((b,bi)=>{const W=b.offsetWidth,H=b.offsetHeight,r=rng(31+bi*17);
 for(let i=0;i<Math.round(W/70);i++){const d=document.createElement('div');d.className='bokeh';const s=2+r()*(H/45);
  d.style.cssText=`width:${s}px;height:${s}px;left:${r()*W}px;top:${r()*H}px;opacity:${.12+r()*.4};filter:blur(${r()<.4?s/2.5:0}px);box-shadow:0 0 ${s*2}px #22d3ff`;b.insertBefore(d,b.children[1])}});
</script></body></html>
